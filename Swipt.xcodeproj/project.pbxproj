his version of expo. Update expo-modules-jsi by reinstalling the app's dependencies so they match this version of expo, then build again.\" >&2\n  exit 1\nfi\n\nexport RN_DIR\nexec /bin/bash \"$JSI_DIR/apple/scripts/build-swiftpm-app-phase.sh\"\n";
