syntax = "proto3";

package swipt.v1;

import "google/protobuf/timestamp.proto";
import "swipt/v1/common.proto";

option go_package = "github.com/swipt-automation/swipt/internal/api/gen/swipt/v1;swiptv1";

service LogService {
  rpc ReadLogs(ReadLogsRequest) returns (stream ReadLogsResponse);
}

message ReadLogsRequest {
  LogLevel level = 1;
  string swiplet_id = 2;
  google.protobuf.Timestamp since = 3;
  uint32 tail = 4;
  bool follow = 5;
}

message ReadLogsResponse {
  LogEntry entry = 1;
}
