syntax = "proto3";

package swipt.v1;

import "swipt/v1/common.proto";

option go_package = "github.com/swipt-automation/swipt/internal/api/gen/swipt/v1;swiptv1";

service REPLService {
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);
  rpc Reset(ResetRequest) returns (ResetResponse);
  rpc GetDeclarations(GetDeclarationsRequest) returns (GetDeclarationsResponse);
}

message ExecuteRequest {
  string code = 1;
  uint32 timeout_ms = 2;
}

message ConsoleOutput {
  LogLevel level = 1;
  string text = 2;
}

message ScriptValue {
  string json = 1;
  string text = 2;
}

message ExecuteResponse {
  oneof part {
    ConsoleOutput console = 1;
    ScriptValue value = 2;
    bytes image = 3;
    ScriptError error = 4;
  }
}

message ResetRequest {}

message ResetResponse {}

message GetDeclarationsRequest {}

message GetDeclarationsResponse {
  string typescript = 1;
}
