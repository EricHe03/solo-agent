name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Release
        run: |-
          source .github/github.sh
          retry gh release download nightly -D build --clobber -p Swipt.ipa -p Swipt-iOS.dSYMs.zip -p metadata.json -p icon.png
          if [ "$(jq .build build/metadata.json)" != "$(git tag -l --format='%(contents:subject)' nightly)" ]; then
            echo "nightly was updated during the release, run it again" >&2
            exit 1
          fi
          RUN=$(retry gh run list --workflow build.yml --commit "$(git rev-parse 'nightly^{commit}')" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN" ]; then
            echo "no build run found for nightly" >&2
            exit 1
          fi
          for cpu in arm64 x64; do
            retry gh run download "$RUN" -D build -n "swipt-server-darwin-$cpu"
          done
          TAG=v$(jq -r .version build/metadata.json)
          if retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> /dev/null || [ -n "$(retry drafts "$TAG")" ]; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          if PREVIOUS=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            NOTES=$(git log --format='* %s' "$PREVIOUS..nightly")
          else
            NOTES=$(git log --format='* %s' nightly)
          fi
          go run ./internal/cmd/build_altstore_source -tag "$TAG"
          retry create_draft "$TAG" --target "$(git rev-parse 'nightly^{commit}')" --notes "$NOTES" \
            build/Swipt.ipa build/Swipt-iOS.dSYMs.zip build/metadata.json build/icon.png build/altstore/altstore.json
          git archive 'nightly^{commit}' api cli | tar -x -C build
          for cpu in arm64 x64; do
            mkdir -p "build/server-darwin-$cpu"
            install -m 755 "build/swipt-server-darwin-$cpu" "build/server-darwin-$cpu/swipt-server"
            jq -n --arg cpu "$cpu" --arg version "$(jq -r .version build/cli/package.json)" '{name: "@swipt/server-darwin-\($cpu)", version: $version, license: "GPL-3.0-or-later",
              repository: {type: "git", url: "https://github.com/swipt-automation/swipt.git", directory: "cmd/swipt-server"},
              os: ["darwin"], cpu: [$cpu], bin: {"swipt-server": "swipt-server"}, files: ["swipt-server"], publishConfig: {access: "public"}}' \
              > "build/server-darwin-$cpu/package.json"
          done
          npm install -g npm@latest
          for package in api server-darwin-arm64 server-darwin-x64 cli; do
            cp LICENSE "build/$package/"
            PACKAGE=$(node -p "const p = require('./build/$package/package.json'); p.name + '@' + p.version")
            if npm view "$PACKAGE" version > /dev/null 2>&1; then
              echo "$PACKAGE is already published"
            else
              npm publish "./build/$package"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
