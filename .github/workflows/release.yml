name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Release
        run: |-
          gh release download nightly -D build -p Swipt.ipa -p Swipt-iOS.dSYMs.zip -p metadata.json -p icon.png
          if [ "$(jq .build build/metadata.json)" != "$(git tag -l --format='%(contents:subject)' nightly)" ]; then
            echo "nightly was updated during the release, run it again" >&2
            exit 1
          fi
          TAG=v$(jq -r .version build/metadata.json)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          if PREVIOUS=$(gh release view --json tagName --jq .tagName); then
            NOTES=$(git log --format='* %s' "$PREVIOUS..nightly")
          else
            NOTES=$(git log --format='* %s' nightly)
          fi
          go run ./internal/cmd/build_altstore_source -tag "$TAG"
          gh release create "$TAG" --draft --target "$(git rev-parse 'nightly^{commit}')" --notes "$NOTES" \
            build/Swipt.ipa build/Swipt-iOS.dSYMs.zip build/metadata.json build/icon.png build/altstore/altstore.json
          git archive 'nightly^{commit}' api cli | tar -x -C build
          npm install -g npm@latest
          for package in api cli; do
            cp LICENSE "build/$package/"
            PACKAGE=$(node -p "const p = require('./build/$package/package.json'); p.name + '@' + p.version")
            if npm view "$PACKAGE" version > /dev/null 2>&1; then
              echo "$PACKAGE is already published"
            else
              npm publish "./build/$package"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
