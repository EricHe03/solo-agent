name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ios_ipa:
    name: Build iOS ARM64 IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          submodules: true

      - name: Select stable Xcode
        run: .github/select_xcode.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build LibSwipt for physical iOS devices
        run: go run ./internal/cmd/build_libswipt -target ios/arm64

      - name: Set up React Native frameworks
        run: bun dev frameworks

      - name: Archive unsigned IPA
        run: make archive_ios_ipa altstore_icon
        env:
          XCODEBUILD_FLAGS: CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Package dSYMs
        run: ditto -c -k --keepParent build/Swipt-iOS.xcarchive/dSYMs build/Swipt-iOS.dSYMs.zip

      - name: Write metadata
        run: |
          INFO_PLIST=build/Swipt-iOS.xcarchive/Products/Applications/Swipt.app/Info.plist
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO_PLIST")
          BUILD=$(plutil -extract CFBundleVersion raw "$INFO_PLIST")
          printf '{"version":"%s","build":%s,"sha":"%s"}\n' "$VERSION" "$BUILD" "$GITHUB_SHA" > build/metadata.json

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Agent-iOS-IPA
          path: |
            build/Swipt.ipa
            build/Swipt-iOS.dSYMs.zip
            build/metadata.json
            build/altstore
          if-no-files-found: error
